name: commands_checkpoint
config_version: 1.0
class_name: SimpleCheckpoint
run_name_template: "%Y%m%d-%H%M%S-commands"
validations:
  - batch_request:
      datasource_name: pandas_runtime
      data_connector_name: runtime_data_connector
      data_asset_name: commands
      runtime_parameters:
        path: dataset/commands.jsonl
      batch_identifiers:
        default_identifier: commands
      batch_spec_passthrough:
        reader_method: read_json
        reader_options:
          lines: true
    expectation_suite_name: commands_suite
