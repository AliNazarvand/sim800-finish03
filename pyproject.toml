[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim800-platform-all"
version = "0.1.0"
description = "Data-driven SIM800 AT command platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "pdfplumber>=0.11", "pytesseract>=0.3", "pyyaml>=6.0", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML>=6.0.12.20250915", "types-jsonschema>=4.24.0.20250915"]

[project.scripts]
sim800 = "sim800_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=sim800_driver --cov=sim800_adapter --cov=sim800_validation --cov=sim800_diffing --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
exclude = ["notebooks"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["generators.cpp_header.generate_at_urc"]
disallow_untyped_defs = false
disallow_untyped_calls = false
